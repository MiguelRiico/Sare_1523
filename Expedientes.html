<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura y Envío a Google Drive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <div class="max-w-md mx-auto p-4 sm:p-6">
        <header class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-900">Expedientes a Drive</h1>
            <p class="text-sm text-slate-500">Escanea el QR y sube las fotos directo a la nube</p>
        </header>

        <!-- PASO 1: Ingresar o Escanear CURP -->
        <div id="step-curp" class="bg-white rounded-2xl shadow-md p-5 mb-6">
            <h2 class="text-lg font-semibold mb-3 text-slate-700">1. Identificación del Estudiante</h2>
            
            <div class="mb-4">
                <label class="block text-xs font-medium text-slate-500 uppercase mb-1">CURP del Estudiante</label>
                <div class="flex gap-2">
                    <input type="text" id="curp-input" placeholder="Ej. AAAA000000HDFRRC00" 
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg uppercase tracking-wider font-mono text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <button onclick="confirmarCurpManual()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition">OK</button>
                </div>
            </div>

            <div class="border-t border-slate-100 pt-4">
                <p class="text-xs text-slate-500 mb-2 text-center">O usa la cámara para escanear el QR:</p>
                <div id="reader" class="w-full rounded-lg overflow-hidden border border-slate-200"></div>
                <button id="start-scan-btn" onclick="iniciarEscaner()" class="mt-3 w-full bg-slate-800 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-slate-900 transition">
                    Activar Cámara QR
                </button>
            </div>
        </div>

        <!-- PASO 2: Botones de Captura -->
        <div id="step-capture" class="hidden">
            <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 mb-5 flex justify-between items-center">
                <div>
                    <span class="text-xs text-blue-600 font-semibold uppercase block">Estudiante Activo</span>
                    <span id="display-curp" class="font-mono font-bold text-blue-900 text-base"></span>
                </div>
                <button onclick="cambiarCurp()" class="text-xs text-blue-600 underline font-medium hover:text-blue-800">Cambiar</button>
            </div>

            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500 mb-3">Documentos Requeridos</h2>
            
            <div class="space-y-3 mb-6">
                <button onclick="capturarFoto('01_contrato')" id="btn-01_contrato" 
                    class="w-full py-3.5 px-4 rounded-xl text-white font-medium bg-red-500 hover:bg-red-600 shadow-sm transition flex justify-between items-center">
                    <span>1. Contrato</span>
                    <span id="status-01_contrato" class="text-xs bg-red-700 px-2 py-1 rounded-md">Pendiente</span>
                </button>

                <button onclick="capturarFoto('02_curp')" id="btn-02_curp" 
                    class="w-full py-3.5 px-4 rounded-xl text-white font-medium bg-red-500 hover:bg-red-600 shadow-sm transition flex justify-between items-center">
                    <span>2. CURP</span>
                    <span id="status-02_curp" class="text-xs bg-red-700 px-2 py-1 rounded-md">Pendiente</span>
                </button>

                <button onclick="capturarFoto('03_identificacion_anverso')" id="btn-03_identificacion_anverso" 
                    class="w-full py-3.5 px-4 rounded-xl text-white font-medium bg-red-500 hover:bg-red-600 shadow-sm transition flex justify-between items-center">
                    <span>3. Identificación Anverso</span>
                    <span id="status-03_identificacion_anverso" class="text-xs bg-red-700 px-2 py-1 rounded-md">Pendiente</span>
                </button>

                <button onclick="capturarFoto('04_identificacion_reverso')" id="btn-04_identificacion_reverso" 
                    class="w-full py-3.5 px-4 rounded-xl text-white font-medium bg-red-500 hover:bg-red-600 shadow-sm transition flex justify-between items-center">
                    <span>4. Identificación Reverso</span>
                    <span id="status-04_identificacion_reverso" class="text-xs bg-red-700 px-2 py-1 rounded-md">Pendiente</span>
                </button>

                <button onclick="capturarFoto('05_foto_recepcion')" id="btn-05_foto_recepcion" 
                    class="w-full py-3.5 px-4 rounded-xl text-white font-medium bg-red-500 hover:bg-red-600 shadow-sm transition flex justify-between items-center">
                    <span>5. Foto de Recepción</span>
                    <span id="status-05_foto_recepcion" class="text-xs bg-red-700 px-2 py-1 rounded-md">Pendiente</span>
                </button>
            </div>

            <!-- Botón de Enviar a Drive -->
            <button onclick="subirAGoogleDrive()" id="btn-upload" disabled
                class="w-full py-3.5 rounded-xl text-white font-semibold bg-slate-300 cursor-not-allowed shadow transition">
                ☁️ Guardar en Google Drive
            </button>
        </div>
    </div>

    <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" onchange="procesarFotoCapturada(event)">

    <script>
        // PEGA AQUÍ LA URL DE TU APLICACIÓN WEB DE APPS SCRIPT
        const WEB_APP_URL = "AQUÍ_PEGA_TU_URL_DE_APPS_SCRIPT";

        let curpActual = "";
        let html5QrCode = null;
        let expedienteFotos = {
            "01_contrato": null,
            "02_curp": null,
            "03_identificacion_anverso": null,
            "04_identificacion_reverso": null,
            "05_foto_recepcion": null
        };
        let tipoActualCaptura = "";

        function iniciarEscaner() {
            const scanBtn = document.getElementById('start-scan-btn');
            scanBtn.classList.add('hidden');
            
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    curpActual = decodedText.trim().toUpperCase();
                    html5QrCode.stop().then(() => {
                        activarPanelCaptura();
                    }).catch(err => console.error(err));
                },
                (errorMessage) => {}
            ).catch(err => {
                alert("No se pudo acceder a la cámara.");
                scanBtn.classList.remove('hidden');
            });
        }

        function confirmarCurpManual() {
            const input = document.getElementById('curp-input').value.trim().toUpperCase();
            if (input.length < 10) {
                alert("Por favor ingresa un CURP válido.");
                return;
            }
            curpActual = input;
            if (html5QrCode) { html5QrCode.stop().catch(() => {}); }
            activarPanelCaptura();
        }

        function activarPanelCaptura() {
            document.getElementById('step-curp').classList.add('hidden');
            document.getElementById('step-capture').classList.remove('hidden');
            document.getElementById('display-curp').innerText = curpActual;
        }

        function cambiarCurp() {
            if (confirm("¿Deseas cambiar el CURP? Se perderán las fotos no guardadas.")) {
                curpActual = "";
                expedienteFotos = { "01_contrato": null, "02_curp": null, "03_identificacion_anverso": null, "04_identificacion_reverso": null, "05_foto_recepcion": null };
                reiniciarBotonesUI();
                document.getElementById('step-capture').classList.add('hidden');
                document.getElementById('step-curp').classList.remove('hidden');
                document.getElementById('curp-input').value = "";
            }
        }

        function capturarFoto(tipo) {
            tipoActualCaptura = tipo;
            document.getElementById('camera-input').click();
        }

        function procesarFotoCapturada(event) {
            const file = event.target.files[0];
            if (file && tipoActualCaptura) {
                // Convertir archivo a Base64 para enviarlo por red
                const reader = new FileReader();
                reader.onload = function(e) {
                    expedienteFotos[tipoActualCaptura] = e.target.result;
                    actualizarBotonVerde(tipoActualCaptura);
                    verificarProgresoCompleto();
                };
                reader.readAsDataURL(file);
            }
            event.target.value = "";
        }

        function actualizarBotonVerde(tipo) {
            const btn = document.getElementById(`btn-${tipo}`);
            const status = document.getElementById(`status-${tipo}`);
            btn.classList.remove('bg-red-500', 'hover:bg-red-600');
            btn.classList.add('bg-green-600', 'hover:bg-green-700');
            status.classList.remove('bg-red-700');
            status.classList.add('bg-green-800');
            status.innerText = "✓ Capturada";
        }

        function reiniciarBotonesUI() {
            const tipos = ['01_contrato', '02_curp', '03_identificacion_anverso', '04_identificacion_reverso', '05_foto_recepcion'];
            tipos.forEach(tipo => {
                const btn = document.getElementById(`btn-${tipo}`);
                const status = document.getElementById(`status-${tipo}`);
                btn.classList.remove('bg-green-600', 'hover:bg-green-700');
                btn.classList.add('bg-red-500', 'hover:bg-red-600');
                status.classList.remove('bg-green-800');
                status.classList.add('bg-red-700');
                status.innerText = "Pendiente";
            });
            const dlBtn = document.getElementById('btn-upload');
            dlBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700', 'cursor-pointer');
            dlBtn.classList.add('bg-slate-300', 'cursor-not-allowed');
            dlBtn.disabled = true;
        }

        function verificarProgresoCompleto() {
            const totalTomadas = Object.values(expedienteFotos).filter(f => f !== null).length;
            if (totalTomadas > 0) {
                const dlBtn = document.getElementById('btn-upload');
                dlBtn.classList.remove('bg-slate-300', 'cursor-not-allowed');
                dlBtn.classList.add('bg-blue-600', 'hover:bg-blue-700', 'cursor-pointer');
                dlBtn.disabled = false;
            }
        }

        async function subirAGoogleDrive() {
            const btnUpload = document.getElementById('btn-upload');
            btnUpload.disabled = true;
            btnUpload.innerText = "Subiendo a Google Drive...";

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: "POST",
                    mode: "no-cors", // Requerido para Apps Script web apps desde el navegador
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        curp: curpActual,
                        fotos: expedienteFotos
                    })
                });

                alert(`¡Expediente del estudiante con CURP ${curpActual} guardado exitosamente en Google Drive! Revisa la carpeta "Expedientes Estudiantes".`);
                location.reload(); // Reiniciar para el siguiente estudiante

            } catch (error) {
                console.error(error);
                alert("Hubo un error al conectar con Google Drive.");
                btnUpload.disabled = false;
                btnUpload.innerText = "☁️ Guardar en Google Drive";
            }
        }
    </script>
</body>
</html>
