<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtro Nominal (Rechazos) - SARE 1523</title>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        body { font-family: 'Public Sans', sans-serif; background-color: #f8fafc; }
        .bg-gob-primary { background-color: #691C32; }
        .text-gob-primary { color: #691C32; }
        .border-gob-primary { border-color: #691C32; }
        .btn-gob { background-color: #5b1328; transition: background-color 0.2s; }
        .btn-gob:hover { background-color: #440e1e; }
        @keyframes blink { 0% { opacity: .2; } 20% { opacity: 1; } 100% { opacity: .2; } }
        .saving span { animation-name: blink; animation-duration: 1.4s; animation-iteration-count: infinite; animation-fill-mode: both; }
        .saving span:nth-child(2) { animation-delay: .2s; }
        .saving span:nth-child(3) { animation-delay: .4s; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <script>
        if (!sessionStorage.getItem("sare_user")) {
            window.location.href = "index.html";
        }
    </script>

    <!-- HEADER -->
    <header class="bg-gob-primary text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <div class="bg-white text-gob-primary font-bold px-3 py-2 text-xs rounded shadow">
                    GOBIERNO DE MÉXICO
                </div>
                <div>
                    <h1 class="text-lg font-semibold leading-tight">Filtro Nominal (Rechazos) - SARE 1523</h1>
                    <p class="text-xs text-red-200">Módulo de Validación en Ventanilla</p>
                </div>
            </div>
            <button onclick="limpiarTodo()" class="bg-amber-500 hover:bg-amber-600 text-white font-medium text-xs px-4 py-2 rounded shadow">
                Reiniciar
            </button>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-4xl w-full mx-auto p-4 flex-grow space-y-6">

        <!-- Selector de Pestañas -->
        <div class="bg-white rounded-xl shadow-md p-2 border-t-4 border-gob-primary grid grid-cols-3 gap-2">
            <button onclick="cambiarModo('curp')" id="tabCurp" class="py-2.5 rounded-lg text-xs sm:text-sm font-bold bg-[#691C32] text-white shadow transition text-center">
                🔍 Búsqueda CURP / QR
            </button>
            <button onclick="cambiarModo('nombre')" id="tabNombre" class="py-2.5 rounded-lg text-xs sm:text-sm font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition text-center">
                👤 Buscar por Nombre
            </button>
            <button onclick="cambiarModo('instrucciones')" id="tabInstrucciones" class="py-2.5 rounded-lg text-xs sm:text-sm font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition text-center">
                📖 Instrucciones
            </button>
        </div>

        <!-- 1. SECCIÓN BÚSQUEDA POR CURP -->
        <div id="seccionCurp" class="bg-white rounded-xl shadow-md p-6 border border-slate-200 space-y-4">
            <h2 class="text-sm font-bold text-gray-700 uppercase">Búsqueda Rápida por CURP (Columna H) o Código QR</h2>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="curpInput" maxlength="18" placeholder="Ingrese o escanee los 18 caracteres del CURP" 
                    oninput="this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '')"
                    class="flex-grow uppercase tracking-wider font-mono border border-gray-300 rounded-lg px-4 py-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#691C32]">
                <div class="flex gap-2">
                    <button onclick="consultarCurp()" class="btn-gob text-white font-medium px-6 py-3 rounded-lg text-sm shadow">
                        Buscar
                    </button>
                </div>
            </div>
            <button onclick="iniciarEscanner()" class="w-full bg-[#b2571c] hover:bg-[#9a4b17] text-white font-medium py-3 px-4 rounded-lg flex items-center justify-center space-x-2 shadow transition">
                <span>📷 Escanear QR con Cámara</span>
            </button>
        </div>

        <!-- 2. SECCIÓN BÚSQUEDA POR NOMBRE -->
        <div id="seccionNombre" class="bg-white rounded-xl shadow-md p-6 border border-slate-200 space-y-4 hidden">
            <h2 class="text-sm font-bold text-gray-700 uppercase">Búsqueda por Coincidencia de Nombre</h2>
            <div class="flex flex-col sm:flex-row gap-3">
