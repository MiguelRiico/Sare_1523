<script>
        const usuarioActual = localStorage.getItem("sare_user") || "OPERADOR_CAMPO";
        document.getElementById("lblOperador").innerHTML = `Operador: <strong class="text-emerald-400">${usuarioActual}</strong>`;

        let streamCamara = null;
        let scanActivo = false;

        async function toggleCamara() {
            const video = document.getElementById("video-camara");
            const btn = document.getElementById("btnToggleCamara");

            if (!scanActivo) {
                try {
                    streamCamara = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    video.srcObject = streamCamara;
                    video.setAttribute("playsinline", true);
                    video.play();
                    scanActivo = true;
                    btn.textContent = "🛑 Detener Cámara";
                    btn.className = "mt-3 w-full bg-rose-600 hover:bg-rose-500 text-white text-sm font-semibold py-2 px-4 rounded transition shadow";
                    requestAnimationFrame(escanearFrame);
                } catch (e) {
                    alert("No se pudo acceder a la cámara del dispositivo.");
                }
            } else {
                if (streamCamara) streamCamara.getTracks().forEach(track => track.stop());
                scanActivo = false;
                btn.textContent = "📷 Activar / Usar Cámara";
                btn.className = "mt-3 w-full bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold py-2 px-4 rounded transition shadow";
            }
        }

        // Bucle de escaneo con EXTRACTOR AUTOMÁTICO DE 18 DÍGITOS (CURP)
        function escanearFrame() {
            if (!scanActivo) return;
            const video = document.getElementById("video-camara");
            const canvas = document.getElementById("canvas-camara");
            const context = canvas.getContext("2d");

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.height = video.videoHeight;
                canvas.width = video.videoWidth;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });

                if (code) {
                    let textoCrudo = code.data.trim().toUpperCase();
                    let curpExtraido = extraerCurpDeTexto(textoCrudo);

                    if (curpExtraido) {
                        document.getElementById("txtCurpInput").value = curpExtraido;
                        toggleCamara(); // Apagar cámara al capturar
                        consultarCurpBackend(curpExtraido);
                        return;
                    }
                }
            }
            requestAnimationFrame(escanearFrame);
        }

        // Función blindada para recortar y extraer estrictamente los 18 dígitos del CURP
        function extraerCurpDeTexto(texto) {
            // Limpiar barras y espacios si vienen al inicio
            let limpio = texto.replace(/^[\|\s]+/, '');
            
            // Si el texto trae la estructura larga separada por pipes o barras, tomamos el primer bloque de 18 caracteres
            // O buscamos mediante expresión regular el patrón exacto del CURP
            const regexCurp = /[A-Z]{4}[0-9]{6}[HM][A-Z]{5}[0-9A-Z][0-9]/;
            const coincidencia = limpio.match(regexCurp);
            
            if (coincidencia) {
                return coincidencia[0]; // Retorna exactamente los 18 caracteres limpios
            }
            
            // Alternativa: Si viene al inicio de la cadena seguido de '||' u otros caracteres
            if (limpio.length >= 18) {
                let posibleCurp = limpio.substring(0, 18);
                // Validar que sean letras y números en formato CURP básico
                if (/^[A-Z0-9]{18}$/.test(posibleCurp)) {
                    return posibleCurp;
                }
            }
            
            return null;
        }

        function ejecutarBusquedaManual() {
            let textoIngresado = document.getElementById("txtCurpInput").value.trim().toUpperCase();
            
            // Aplicar el mismo filtro limpiador por si pegaron la cadena completa con pipes
            let curpLimpio = extraerCurpDeTexto(textoIngresado);
            
            if (!curpLimpio || curpLimpio.length !== 18) {
                alert("El CURP no es válido o no contiene 18 caracteres. Verifique el texto ingresado.");
                return;
            }
            
            // Actualizar el input visualmente con los 18 dígitos limpios
            document.getElementById("txtCurpInput").value = curpLimpio;
            consultarCurpBackend(curpLimpio);
        }

        function consultarCurpBackend(curp) {
            const urlWebApps = "https://script.google.com/macros/s/AKfycbz_velz5uz1PdR-GmuZib6IREp2rZJLEBDuhK3jMfLoZ5uFX6vanY5COK87BWwkyZlw/exec?action=buscarCurp&curp=" + encodeURIComponent(curp) + "&usuario=" + encodeURIComponent(usuarioActual);

            document.getElementById("panelResultado").classList.remove("hidden");
            
            // Aquí se conectará a tu Apps Script real
            console.log("Consultando CURP limpio: " + curp);
        }

        function validarEdad(esMayor) {
            const alertaMenor = document.getElementById("alertaMenorEdad");
            if (!esMayor) alertaMenor.classList.remove("hidden");
            else alertaMenor.classList.add("hidden");
        }

        function alertaBoton17_30() {
            alert("📌 Aviso (17-30 SEP): Revisar en SIBUEMS o SICOP para validar si es becario o no.");
        }

        function alertaConvocatoriaAnterior() {
            alert("📂 Convocatoria Anterior: Tal vez la tarjeta está en otro universo de tarjetas, buscar en otros nominales.");
        }
    </script>
